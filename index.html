<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7027A0">
  <meta name="description" content="PiMarket Global connects buyers and sellers in the Pi ecosystem.">
  <title>PiMarket Global</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4fa;
      color: #292238;
      line-height: 1.6;
    }

    header {
      background: #7027a0;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
    }

    nav {
      background: #4e176f;
      padding: 12px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .hero {
      padding: 45px 20px;
      text-align: center;
      background: linear-gradient(135deg, #7027a0, #a34be0);
      color: white;
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .hero p {
      max-width: 600px;
      margin: auto;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 15px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button, .button {
      background: #7027a0;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 15px;
    }

    button:hover, .button:hover {
      background: #4e176f;
    }

    .section-title {
      margin: 15px 0;
      color: #7027a0;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product-icon {
      font-size: 42px;
      text-align: center;
      padding: 12px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #7027a0;
      font-weight: bold;
      margin: 10px 0;
    }

    <form id="sellerForm">
  <label for="sellerName">Full Name</label>
  <input id="sellerName" name="seller" required>

  <label for="sellerEmail">Email Address</label>
  <input id="sellerEmail" name="email" type="email" required>

  <label for="productName">Product or Service</label>
  <input id="productName" name="title" required>

  <label for="category">Category</label>
  <select id="category" name="category" required>
    <option value="">Select a category</option>
    <option value="Business">Business</option>
    <option value="Industrial">Industrial</option>
    <option value="Digital">Digital</option>
  </select>

  <label for="description">Product Description</label>
  <textarea id="description" name="description"
    rows="4" required></textarea>

  <label for="price">Price (₦)</label>
  <input id="price" name="price" type="number"
    min="0" step="0.01" required>

  <label for="location">Location</label>
  <input id="location" name="location" required>

  <label for="phone">Contact Phone Number</label>
  <input id="phone" name="phone" type="tel" required>

  <button type="submit">Submit Product</button>

  <p id="formMessage" role="status" aria-live="polite"></p>
</form>
  </section>

  <section class="form-section" id="contact">
    <h2 class="section-title">Contact PiMarket Global</h2>
    <p>
      For seller registration, partnership and marketplace enquiries,
      contact the PiMarket Global team.
    </p>
    <p><strong>Platform:</strong> PiMarket Global</p>
    <p><strong>Marketplace:</strong> Buyers, sellers and services</p>
  </section>

</main>

<footer>
  <p>&copy; <span id="year"></span> PiMarket Global.</p>
  <p>Connecting buyers and sellers worldwide.</p>
  <p>Trade responsibly and verify sellers before making payments.</p>
</footer>

<script>
  document.getElementById("year").textContent =
    new Date().getFullYear();

  function searchProducts() {
    const query = document.getElementById("searchInput")
      .value.trim().toLowerCase();

    const cards = document.querySelectorAll("#productList .card");

    cards.forEach(function(card) {
      const text = (
        card.innerText + " " + card.dataset.search
      ).toLowerCase();

      card.style.display = text.includes(query) ? "" : "none";
    });
  }

  document.getElementById("searchInput").addEventListener(
    "input", searchProducts
  );

  document.getElementById("sellerForm").addEventListener(
    "submit", function(event) {
      event.preventDefault();

      document.getElementById("formMessage").textContent =
        "Your form is ready, but it has not been sent. " +
        "A backend connection is required to submit and save your listing.";
    }
  );
</script>
<script>
const PIMARKET_API = "https://script.google.com/macros/s/AKfycbx1DwZFhc-ebajFq2CTpYR8KykKmYbNF2HbcbdgnRTUxghw5Rc9ZBrFKxatpIDcU9BY/exec";

async function testPiMarketBackend() {
  try {
    const response = await fetch(PIMARKET_API);
    const data = await response.json();
    console.log("PiMarket Backend:", data);
    return data;
  } catch (error) {
    console.error("Backend connection error:", error);
    return null;
  }
}

testPiMarketBackend();
</script>
</body>
</html>
